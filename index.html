<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INVINCIBLE — Неуязвимая Жизнь</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:'Arial Black',sans-serif; }
canvas { display:block; }

#ui {
  position:absolute; top:0; left:0; width:100%; pointer-events:none;
  padding:14px 18px; display:flex; justify-content:space-between; align-items:flex-start;
}
.hud-left { display:flex; flex-direction:column; gap:7px; }
.hud-row { display:flex; align-items:center; gap:8px; }
.hud-label { color:#fff; font-size:10px; font-weight:900; letter-spacing:1px;
  text-shadow:0 0 6px #000; width:32px; }
.bar-bg { width:140px; height:13px; border-radius:7px;
  background:rgba(0,0,0,0.55); border:1.5px solid rgba(255,255,255,0.25); overflow:hidden; }
.bar-fill { height:100%; border-radius:7px; transition:width .12s; }
#hp-fill  { background:linear-gradient(90deg,#ff3b30,#ff6b35); }
#rage-fill{ background:linear-gradient(90deg,#7b2fff,#ff2d55); }

.hud-right { text-align:right; }
#score-val { color:#fff; font-size:22px; font-weight:900;
  text-shadow:0 0 12px #7b2fff; letter-spacing:2px; }
#combo-val { color:#ffcc00; font-size:13px; font-weight:900; min-height:18px; }
#zone-val  { color:rgba(200,220,255,.65); font-size:10px; letter-spacing:2px; margin-top:2px; }

#dmg-flash {
  position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(255,0,0,.35) 0%,transparent 70%);
  opacity:0;
}
#kill-msg {
  position:absolute; top:42%; left:50%; transform:translate(-50%,-50%);
  font-size:36px; font-weight:900; letter-spacing:4px;
  pointer-events:none; opacity:0; text-align:center;
  text-shadow:0 0 30px currentColor;
}
#boss-bar {
  position:absolute; bottom:60px; left:50%; transform:translateX(-50%);
  width:320px; display:none;
}
#boss-name { color:#ff4444; font-size:11px; font-weight:900;
  letter-spacing:3px; text-align:center; margin-bottom:4px;
  text-shadow:0 0 10px #ff0000; }
.boss-bg { width:100%; height:16px; border-radius:8px;
  background:rgba(0,0,0,.7); border:1.5px solid rgba(255,100,100,.4); overflow:hidden; }
#boss-fill { height:100%; border-radius:8px;
  background:linear-gradient(90deg,#cc0000,#ff4444); transition:width .15s; }

#hints {
  position:absolute; bottom:12px; left:50%; transform:translateX(-50%);
  color:rgba(255,255,255,.35); font-size:10px; letter-spacing:1px;
  pointer-events:none; text-align:center; white-space:nowrap;
}

/* ── INTRO ── */
#intro {
  position:absolute; inset:0; background:rgba(0,0,0,.93);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:12px; z-index:100;
}
.i-title {
  font-size:58px; font-weight:900; letter-spacing:10px;
  background:linear-gradient(130deg,#fff 0%,#00e5ff 40%,#7b2fff 80%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.i-sub { color:rgba(200,220,255,.65); font-size:12px; letter-spacing:3px; }
.i-btn {
  margin-top:10px; padding:14px 44px;
  background:linear-gradient(135deg,#7b2fff,#0066ff);
  border:none; border-radius:12px; color:#fff;
  font-size:18px; font-weight:900; letter-spacing:3px;
  cursor:pointer; pointer-events:all;
  box-shadow:0 0 32px rgba(123,47,255,.6);
  transition:transform .15s,box-shadow .15s;
}
.i-btn:hover { transform:scale(1.06); box-shadow:0 0 52px rgba(123,47,255,.9); }
.i-keys { color:rgba(255,255,255,.4); font-size:11px; letter-spacing:1px; }

/* ── GAME OVER ── */
#gameover {
  position:absolute; inset:0; background:rgba(0,0,0,.88);
  display:none; flex-direction:column; align-items:center; justify-content:center;
  gap:12px; z-index:100;
}
.go-title { font-size:52px; font-weight:900; letter-spacing:8px; color:#ff3b30;
  text-shadow:0 0 40px #ff0000; }
#go-score { color:rgba(255,255,255,.75); font-size:18px; letter-spacing:3px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div class="hud-left">
    <div class="hud-row">
      <span class="hud-label" style="color:#ff6b35">HP</span>
      <div class="bar-bg"><div class="bar-fill" id="hp-fill" style="width:100%"></div></div>
    </div>
    <div class="hud-row">
      <span class="hud-label" style="color:#bb88ff">RAGE</span>
      <div class="bar-bg"><div class="bar-fill" id="rage-fill" style="width:0%"></div></div>
    </div>
  </div>
  <div class="hud-right">
    <div id="score-val">0</div>
    <div id="combo-val"></div>
    <div id="zone-val">EARTH ORBIT</div>
  </div>
</div>

<div id="dmg-flash"></div>
<div id="kill-msg"></div>

<div id="boss-bar">
  <div id="boss-name">ВИЛТРУМИТ — КОМАНДИР</div>
  <div class="boss-bg"><div id="boss-fill" style="width:100%"></div></div>
</div>

<div id="hints">WASD / ↑↓←→ — лети &nbsp;|&nbsp; SPACE — удар &nbsp;|&nbsp; Q — суперудар &nbsp;|&nbsp; E — лазерный взгляд</div>

<div id="intro">
  <div class="i-title">INVINCIBLE</div>
  <div class="i-sub">НЕУЯЗВИМАЯ ЖИЗНЬ</div>
  <div class="i-sub" style="color:rgba(255,200,100,.7);font-size:11px">Марк Грейсон · Наследие Вилтрума</div>
  <button class="i-btn" id="start-btn">▶ НАЧАТЬ</button>
  <div class="i-keys">WASD — полёт · SPACE — удар · Q — суперудар · E — лазерный взгляд</div>
</div>

<div id="gameover">
  <div class="go-title">ТЫ ПОГИБ</div>
  <div id="go-score"></div>
  <button class="i-btn" id="restart-btn">↺ ЗАНОВО</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

let W = canvas.width  = window.innerWidth;
let H = canvas.height = window.innerHeight;
window.addEventListener('resize', () => {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
});

// ── Input
const keys = {};
window.addEventListener('keydown', e => { keys[e.code]=true;  if(['mouseLeft','KeyQ','KeyE','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); });
window.addEventListener('keyup',   e => { keys[e.code]=false; });

// ── Game state
let gameRunning = false;
let score=0, combo=0, comboTimer=0;
let killMsgTimer=0, killMsgText='', killMsgColor='#fff';
let zoneIndex=0, zoneTimer=0;
let frameCount=0;
let raf;

// Camera (follows player)
const cam = { x:0, y:0 };

// ── Zones
const ZONES = [
  { name:'EARTH ORBIT',   bg:'#000d20', star:'#88aaff', accent:'#2255ff' },
  { name:'VILTRUM SPACE', bg:'#0d0008', star:'#ff6688', accent:'#cc0033' },
  { name:'DEEP COSMOS',   bg:'#020010', star:'#aaaaff', accent:'#4433cc' },
  { name:'BATTLE ZONE',   bg:'#0d0500', star:'#ffaa44', accent:'#cc4400' },
];

// ── Player
const P = {
  x:0, y:0, vx:0, vy:0,
  hp:1000, maxHp:1000, rage:0, maxRage:1000,
  size:20, speed:5.2,
  invincTimer:0,
  // attacks
  punching:false, punchTimer:0, punchDir:0,
  superPunch:false, superTimer:0,
  laser:false, laserTimer:0,
  rageActive:false, rageTimer:0,
  // trail
  trail:[],
};

// ── Entities
let enemies = [];
let particles = [];
let shockwaves = [];
let stars = [];
let planets = [];
let floatingTexts = [];

let bossRef = null;
let enemySpawnTimer = 0;

// ════════════════════════════════
//  INIT
// ════════════════════════════════
function initStars() {
  stars = [];
  for (let i=0;i<260;i++) {
    stars.push({
      x: (Math.random()-0.5)*4000,
      y: (Math.random()-0.5)*4000,
      r: Math.random()*1.8+0.25,
      phase: Math.random()*Math.PI*2,
    });
  }
}

function initPlanets() {
  planets = [];
  const configs = [
    { r:95,  color:'#1a3a88', ring:true,  ringColor:'#335599', dist:900  },
    { r:55,  color:'#883322', ring:false, ringColor:null,       dist:1300 },
    { r:130, color:'#1a1a55', ring:true,  ringColor:'#4444aa', dist:1800 },
    { r:40,  color:'#224422', ring:false, ringColor:null,       dist:2200 },
    { r:70,  color:'#552244', ring:true,  ringColor:'#aa4488', dist:2700 },
    { r:180, color:'#0a2a44', ring:true,  ringColor:'#2288bb', dist:3400 },
  ];
  configs.forEach((c,i) => {
    const a = (i/configs.length)*Math.PI*2 + Math.random()*0.5;
    planets.push({ ...c, angle:a, ox:Math.cos(a)*c.dist, oy:Math.sin(a)*c.dist });
  });
}

function resetGame() {
  P.x=0; P.y=0; P.vx=0; P.vy=0;
  P.hp=100; P.rage=0; P.invincTimer=0;
  P.punching=false; P.punchTimer=0;
  P.superPunch=false; P.superTimer=0;
  P.laser=false; P.laserTimer=0;
  P.rageActive=false; P.rageTimer=0;
  P.trail=[];
  cam.x=0; cam.y=0;
  enemies=[]; particles=[]; shockwaves=[];
  floatingTexts=[];
  score=0; combo=0; comboTimer=0;
  zoneIndex=0; zoneTimer=0; frameCount=0;
  bossRef=null; enemySpawnTimer=0;
  initStars(); initPlanets();
}

function startGame() {
  resetGame();
  gameRunning=true;
  document.getElementById('intro').style.display='none';
  document.getElementById('gameover').style.display='none';
  document.getElementById('boss-bar').style.display='none';
  if(raf) cancelAnimationFrame(raf);
  loop();
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

// ════════════════════════════════
//  SPAWN ENEMY
// ════════════════════════════════
function spawnEnemy(forceType) {
  const angle = Math.random()*Math.PI*2;
  const dist  = 520 + Math.random()*200;
  const sx    = P.x + Math.cos(angle)*dist;
  const sy    = P.y + Math.sin(angle)*dist;

  const isBoss  = forceType==='boss' || (score>600 && !bossRef && Math.random()<0.06);
  const isElite = !isBoss && (Math.random()<0.18);

  const e = {
    x:sx, y:sy, vx:0, vy:0,
    hp: isBoss?300 : isElite?70 : 28,
    maxHp: isBoss?300 : isElite?70 : 28,
    size: isBoss?40 : isElite?24 : 17,
    speed: isBoss?1.3 : isElite?2.0 : 2.8+Math.random()*0.8,
    isBoss, isElite,
    bodyColor: isBoss?'#990000' : isElite?'#772200' : '#331100',
    armorColor: isBoss?'#ff4444' : isElite?'#ff6622' : '#ff8844',
    attackTimer: 40+Math.random()*60,
    glowPhase: Math.random()*Math.PI*2,
    stunTimer:0,
  };

  if(isBoss) {
    bossRef=e;
    document.getElementById('boss-bar').style.display='block';
  }
  enemies.push(e);
}

// ════════════════════════════════
//  PARTICLES
// ════════════════════════════════
function burst(x,y,count,color,spd,sz,life) {
  for(let i=0;i<count;i++) {
    const a=Math.random()*Math.PI*2;
    const s=spd*(0.4+Math.random()*0.9);
    particles.push({ x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      life, maxLife:life, color, size:sz*(0.4+Math.random()) });
  }
}

function floatText(x,y,text,color,size) {
  floatingTexts.push({ x,y, vy:-1.5-Math.random(), text, color,
    size:size||20, life:60, maxLife:60 });
}

// ════════════════════════════════
//  ATTACK HELPERS
// ════════════════════════════════
function punchNearbyEnemies(ox,oy,range,dmg,isSuper) {
  let hit=false;
  enemies.forEach(e => {
    const dx=e.x-ox, dy=e.y-oy;
    if(Math.hypot(dx,dy)<range+e.size) {
      dealDamageToEnemy(e,dmg,isSuper);
      hit=true;
    }
  });
  return hit;
}

function laserHit() {
  // Ray from player in the direction they're moving (or right if still)
  const vLen = Math.hypot(P.vx,P.vy)||1;
  const dx=P.vx/vLen, dy=P.vy/vLen;
  const len=600;
  enemies.forEach(e => {
    // distance from e to line
    const ex=e.x-P.x, ey=e.y-P.y;
    const proj=ex*dx+ey*dy;
    if(proj<0||proj>len) return;
    const perp=Math.abs(ex*dy - ey*dx);
    if(perp<e.size+10) dealDamageToEnemy(e,2,false);
  });
}

function dealDamageToEnemy(e,dmg,isSuper) {
  if(e.stunTimer>0 && !isSuper) dmg*=1.5;
  e.hp -= dmg;
  e.stunTimer = isSuper?30:10;
  // knockback
  const dx=e.x-P.x, dy=e.y-P.y;
  const d=Math.hypot(dx,dy)||1;
  const kb = isSuper?20:7;
  e.vx += (dx/d)*kb;
  e.vy += (dy/d)*kb;

  burst(e.x,e.y, isSuper?18:8, isSuper?'#ff4400':'#ffaa44', isSuper?8:5, isSuper?5:3, isSuper?40:25);

  if(e.hp<=0) killEnemy(e,isSuper);
}

function killEnemy(e,isSuper) {
  const idx=enemies.indexOf(e);
  if(idx===-1) return;
  enemies.splice(idx,1);

  combo++;
  comboTimer=180;
  const gained = e.isBoss?200 : e.isElite?50 : 10;
  const pts = gained * (combo>=5?2:1);
  score += pts;

  P.rage = Math.min(P.maxRage, P.rage + (e.isBoss?30:e.isElite?12:5));

  burst(e.x,e.y, e.isBoss?50:20, '#ff6600', e.isBoss?12:7, e.isBoss?7:4, e.isBoss?60:35);
  burst(e.x,e.y, e.isBoss?30:10, '#ffcc00', e.isBoss?8:4,  e.isBoss?4:2, e.isBoss?50:28);
  shockwaves.push({ x:e.x,y:e.y, r:0, maxR:e.isBoss?200:80, color:e.isBoss?'#ff0000':'#ff8800', life:1 });

  if(e.isBoss) {
    bossRef=null;
    document.getElementById('boss-bar').style.display='none';
    showKillMsg('ВИЛТРУМИТ ПОВЕРЖЕН!','#ff4444');
    floatText(e.x,e.y-50,'BOSS!','#ff4444',32);
    zoneIndex=(zoneIndex+1)%ZONES.length;
  } else {
    if(combo>=10) floatText(e.x,e.y-30,'COMBO x'+combo,'#ffcc00',22);
    else floatText(e.x,e.y-20,'+'+pts,'#ffaa44',16);
  }
}

function showKillMsg(text,color) {
  killMsgText=text; killMsgColor=color; killMsgTimer=120;
  const el=document.getElementById('kill-msg');
  el.textContent=text;
  el.style.color=color;
  el.style.opacity='1';
}

// ════════════════════════════════
//  UPDATE
// ════════════════════════════════
function update() {
  frameCount++;

  // Zone progression
  zoneTimer++;
  if(zoneTimer>1400) { zoneTimer=0; zoneIndex=(zoneIndex+1)%ZONES.length; }

  // Enemy spawn
  enemySpawnTimer++;
  const spawnRate = Math.max(60, 140 - Math.floor(score/80));
  if(enemySpawnTimer>=spawnRate) {
    enemySpawnTimer=0;
    spawnEnemy();
    if(score>300 && Math.random()<0.3) spawnEnemy();
  }

  // ── Player movement
  let ax=0, ay=0;
  if(keys['ArrowLeft']||keys['KeyA'])  ax-=1;
  if(keys['ArrowRight']||keys['KeyD']) ax+=1;
  if(keys['ArrowUp']||keys['KeyW'])    ay-=1;
  if(keys['ArrowDown']||keys['KeyS'])  ay+=1;
  const len=Math.hypot(ax,ay); if(len>0){ax/=len;ay/=len;}

  const spd = P.rageActive?P.speed*1.6:P.speed;
  P.vx += ax*spd*0.22;
  P.vy += ay*spd*0.22;
  P.vx *= 0.88; P.vy *= 0.88;

  P.x += P.vx; P.y += P.vy;

  // Trail
  P.trail.push({ x:P.x, y:P.y });
  if(P.trail.length>18) P.trail.shift();

  // Camera smoothly follows
  cam.x += (P.x - cam.x)*0.12;
  cam.y += (P.y - cam.y)*0.12;

  // ── Attacks
  // Punch
  if(keys['mouseLeft'] && !P.punching) {
    P.punching=true; P.punchTimer=20;
    P.punchDir=Math.atan2(P.vy||0, P.vx||1);
    const ox=P.x+Math.cos(P.punchDir)*38, oy=P.y+Math.sin(P.punchDir)*38;
    const hit=punchNearbyEnemies(ox,oy,52,22,false);
    if(!hit) punchNearbyEnemies(P.x,P.y,60,22,false);
    burst(ox,oy,10,'#ffffff',7,4,20);
    shockwaves.push({ x:ox,y:oy, r:0, maxR:55, color:'#ffffff', life:1 });
  }
  if(P.punching){ P.punchTimer--; if(P.punchTimer<=0) P.punching=false; }

  // Super punch (Q)
  if(keys['KeyQ'] && P.rage>=40 && !P.superPunch) {
    P.superPunch=true; P.superTimer=30; P.rageActive=true; P.rageTimer=180;
    P.rage-=40;
    const ox=P.x+Math.cos(P.punchDir)*60, oy=P.y+Math.sin(P.punchDir)*60;
    punchNearbyEnemies(P.x,P.y,140,80,true);
    burst(P.x,P.y,35,'#7b2fff',14,7,55);
    burst(P.x,P.y,20,'#ff2d55',10,5,45);
    shockwaves.push({ x:P.x,y:P.y, r:0, maxR:200, color:'#7b2fff', life:1 });
    showKillMsg('СУПЕРУДАР!','#7b2fff');
  }
  if(P.superPunch){ P.superTimer--; if(P.superTimer<=0) P.superPunch=false; }

  // Rage timer
  if(P.rageActive){ P.rageTimer--; if(P.rageTimer<=0) P.rageActive=false; }

  // Laser (E)
  if(keys['KeyE'] && P.rage>=20) {
    P.laser=true; P.laserTimer=15;
    P.rage=Math.max(0,P.rage-0.7);
    laserHit();
    burst(P.x,P.y,3,'#ffff00',3,2,15);
  } else {
    P.laser=false;
  }

  // ── Enemies update
  enemies.forEach(e => {
    e.glowPhase+=0.05;
    if(e.stunTimer>0) { e.stunTimer--; e.vx*=0.7; e.vy*=0.7; }
    else {
      const dx=P.x-e.x, dy=P.y-e.y;
      const d=Math.hypot(dx,dy)||1;
      e.vx += (dx/d)*e.speed*0.18;
      e.vy += (dy/d)*e.speed*0.18;
      e.vx*=0.9; e.vy*=0.9;
    }
    e.x+=e.vx; e.y+=e.vy;

    // Enemy attacks player
    if(P.invincTimer<=0) {
      e.attackTimer--;
      if(e.attackTimer<=0) {
        e.attackTimer=50+Math.random()*60;
        const dx=P.x-e.x, dy=P.y-e.y;
        if(Math.hypot(dx,dy)<e.size+P.size+30) {
          const dmg = e.isBoss?18:e.isElite?10:5;
          P.hp=Math.max(0,P.hp-dmg);
          P.invincTimer=40;
          // knockback player
          const d2=Math.hypot(dx,dy)||1;
          P.vx-=(dx/d2)*6; P.vy-=(dy/d2)*6;
          // flash
          const el=document.getElementById('dmg-flash');
          el.style.opacity='1';
          setTimeout(()=>el.style.opacity='0',160);
          burst(P.x,P.y,10,'#ff0000',6,4,25);
        }
      }
    }
  });

  if(P.invincTimer>0) P.invincTimer--;

  // ── Particles
  particles = particles.filter(p=>{
    p.x+=p.vx; p.y+=p.vy;
    p.vx*=0.93; p.vy*=0.93;
    p.life--;
    return p.life>0;
  });

  // ── Shockwaves
  shockwaves = shockwaves.filter(s=>{
    s.r += (s.maxR-s.r)*0.18+1;
    s.life -= 1/30;
    return s.life>0;
  });

  // ── Floating texts
  floatingTexts = floatingTexts.filter(ft=>{
    ft.y+=ft.vy; ft.life--;
    return ft.life>0;
  });

  // ── Combo timer
  if(comboTimer>0) { comboTimer--; if(comboTimer<=0) combo=0; }

  // ── Kill msg
  if(killMsgTimer>0) {
    killMsgTimer--;
    if(killMsgTimer<=0) document.getElementById('kill-msg').style.opacity='0';
  }

  // ── HUD
  document.getElementById('hp-fill').style.width   = (P.hp/P.maxHp*100)+'%';
  document.getElementById('rage-fill').style.width  = (P.rage/P.maxRage*100)+'%';
  document.getElementById('score-val').textContent  = score;
  document.getElementById('combo-val').textContent  = combo>=3?'COMBO ×'+combo:'';
  document.getElementById('zone-val').textContent   = ZONES[zoneIndex].name;

  if(bossRef) {
    document.getElementById('boss-fill').style.width=(bossRef.hp/bossRef.maxHp*100)+'%';
  }

  // ── Death
  if(P.hp<=0) {
    gameRunning=false;
    document.getElementById('go-score').textContent='ОЧКИ: '+score;
    document.getElementById('gameover').style.display='flex';
  }
}

// ════════════════════════════════
//  DRAW
// ════════════════════════════════
function draw() {
  const zone = ZONES[zoneIndex];
  const cx = W/2 - cam.x;
  const cy = H/2 - cam.y;

  // Background
  ctx.fillStyle = zone.bg;
  ctx.fillRect(0,0,W,H);

  // Nebula glow (behind everything)
  const nebX = W/2 + Math.sin(frameCount*0.003)*60;
  const nebY = H/2 + Math.cos(frameCount*0.004)*40;
  const nb = ctx.createRadialGradient(nebX,nebY,0,nebX,nebY,Math.min(W,H)*0.7);
  nb.addColorStop(0, hexA(zone.accent,0.07));
  nb.addColorStop(1, 'transparent');
  ctx.fillStyle=nb;
  ctx.fillRect(0,0,W,H);

  // Stars
  stars.forEach(s=>{
    const sx = cx + s.x;
    const sy = cy + s.y;
    if(sx<-5||sx>W+5||sy<-5||sy>H+5) return;
    const tw = 0.5+0.5*Math.sin(s.phase+frameCount*0.04);
    ctx.globalAlpha = 0.4+0.6*tw;
    ctx.fillStyle = zone.star;
    ctx.beginPath();
    ctx.arc(sx,sy,s.r,0,Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha=1;

  // Planets
  planets.forEach(pl=>{
    const px=cx+pl.ox, py=cy+pl.oy;
    if(px<-pl.r*2||px>W+pl.r*2||py<-pl.r*2||py>H+pl.r*2) return;
    ctx.save();
    // Planet body
    const pg=ctx.createRadialGradient(px-pl.r*0.3,py-pl.r*0.3,0,px,py,pl.r);
    pg.addColorStop(0, lighten(pl.color,40));
    pg.addColorStop(1, pl.color);
    ctx.fillStyle=pg;
    ctx.beginPath();
    ctx.arc(px,py,pl.r,0,Math.PI*2);
    ctx.fill();
    // Atmosphere rim
    ctx.strokeStyle=hexA(lighten(pl.color,60),0.25);
    ctx.lineWidth=4;
    ctx.beginPath();
    ctx.arc(px,py,pl.r+2,0,Math.PI*2);
    ctx.stroke();
    // Ring
    if(pl.ring) {
      ctx.save();
      ctx.translate(px,py);
      ctx.scale(1,0.28);
      ctx.strokeStyle=hexA(pl.color==='#0a2a44'?'#2288bb':'#8866aa',0.55);
      ctx.lineWidth=pl.r*0.22;
      ctx.beginPath();
      ctx.arc(0,0,pl.r*1.6,0,Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  });

  // Shockwaves
  shockwaves.forEach(s=>{
    ctx.globalAlpha=s.life*0.5;
    ctx.strokeStyle=s.color;
    ctx.lineWidth=2.5;
    ctx.beginPath();
    ctx.arc(cx+s.x, cy+s.y, s.r,0,Math.PI*2);
    ctx.stroke();
  });
  ctx.globalAlpha=1;

  // Particles
  particles.forEach(p=>{
    const a=p.life/p.maxLife;
    ctx.globalAlpha=a;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(cx+p.x, cy+p.y, p.size*a+0.5,0,Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha=1;

  // Enemies
  enemies.forEach(e=>{
    const ex=cx+e.x, ey=cy+e.y;
    const glow=0.5+0.5*Math.sin(e.glowPhase);

    ctx.save();
    ctx.translate(ex,ey);

    // Threat aura
    if(e.isBoss||e.isElite) {
      const auraColor = e.isBoss?'rgba(200,0,0,':'rgba(180,80,0,';
      const ag=ctx.createRadialGradient(0,0,e.size,0,0,e.size*(e.isBoss?2.8:2.0));
      ag.addColorStop(0, auraColor+(0.18*glow)+')');
      ag.addColorStop(1,'transparent');
      ctx.fillStyle=ag;
      ctx.beginPath();
      ctx.arc(0,0,e.size*(e.isBoss?2.8:2.0),0,Math.PI*2);
      ctx.fill();
    }

    // Body
    ctx.fillStyle=e.bodyColor;
    ctx.beginPath();
    ctx.arc(0,0,e.size,0,Math.PI*2);
    ctx.fill();

    // Viltrum armor plates
    ctx.strokeStyle=e.armorColor;
    ctx.lineWidth=e.isBoss?3.5:2;
    ctx.beginPath();
    ctx.arc(0,0,e.size-3,0,Math.PI*2);
    ctx.stroke();

    // Armor shard lines
    for(let i=0;i<(e.isBoss?8:4);i++) {
      const a=(i/(e.isBoss?8:4))*Math.PI*2;
      ctx.strokeStyle=hexA(e.armorColor,0.5+0.4*glow);
      ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*e.size*0.4, Math.sin(a)*e.size*0.4);
      ctx.lineTo(Math.cos(a)*e.size,     Math.sin(a)*e.size);
      ctx.stroke();
    }

    // Eyes (red viltrum)
    ctx.fillStyle=`rgba(255,${Math.floor(80+glow*120)},0,1)`;
    ctx.beginPath();
    ctx.ellipse(-e.size*0.22, -e.size*0.15, e.size*0.14, e.size*0.1, 0,0,Math.PI*2);
    ctx.ellipse( e.size*0.22, -e.size*0.15, e.size*0.14, e.size*0.1, 0,0,Math.PI*2);
    ctx.fill();

    // Boss crown spikes
    if(e.isBoss) {
      ctx.fillStyle='#cc0000';
      for(let i=0;i<6;i++) {
        const a=(i/6)*Math.PI*2;
        ctx.save();
        ctx.rotate(a);
        ctx.beginPath();
        ctx.moveTo(0,-e.size);
        ctx.lineTo(-4,-e.size-16);
        ctx.lineTo(4,-e.size-16);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    // HP bar
    if(e.hp<e.maxHp) {
      const bw=e.size*2.2, bh=5, bx=-bw/2, by=e.size+5;
      ctx.fillStyle='rgba(0,0,0,0.6)';
      ctx.fillRect(bx,by,bw,bh);
      const pct=e.hp/e.maxHp;
      ctx.fillStyle=pct>0.5?'#44ff44':pct>0.25?'#ffaa00':'#ff2200';
      ctx.fillRect(bx,by,bw*pct,bh);
    }

    ctx.restore();
  });

  // ── PLAYER
  drawPlayer(cx+P.x, cy+P.y);

  // ── Laser beam
  if(P.laser) {
    const vLen=Math.hypot(P.vx,P.vy)||1;
    const lx=P.vx/vLen, ly=P.vy/vLen;
    const ex2=P.x+lx*620, ey2=P.y+ly*620;
    ctx.save();
    // outer beam
    ctx.globalAlpha=0.35;
    ctx.strokeStyle='#ffdd00';
    ctx.lineWidth=14;
    ctx.lineCap='round';
    ctx.shadowColor='#ffff00';
    ctx.shadowBlur=20;
    ctx.beginPath();
    ctx.moveTo(cx+P.x+lx*P.size, cy+P.y+ly*P.size);
    ctx.lineTo(cx+ex2, cy+ey2);
    ctx.stroke();
    // inner beam
    ctx.globalAlpha=0.85;
    ctx.strokeStyle='#ffffff';
    ctx.lineWidth=4;
    ctx.shadowBlur=10;
    ctx.beginPath();
    ctx.moveTo(cx+P.x+lx*P.size, cy+P.y+ly*P.size);
    ctx.lineTo(cx+ex2, cy+ey2);
    ctx.stroke();
    ctx.restore();
  }

  // Floating texts
  floatingTexts.forEach(ft=>{
    const a=ft.life/ft.maxLife;
    ctx.globalAlpha=a;
    ctx.fillStyle=ft.color;
    ctx.font=`900 ${ft.size}px Arial Black`;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(ft.text, cx+ft.x, cy+ft.y);
  });
  ctx.globalAlpha=1;
}

// ════════════════════════════════
//  DRAW PLAYER (Mark Grayson)
// ════════════════════════════════
function drawPlayer(px,py) {
  ctx.save();
  ctx.translate(px,py);

  // Cape trail
  for(let i=0;i<P.trail.length;i++) {
    const t=P.trail[i];
    const rx=(t.x-cam.x)-(px-W/2);
    const ry=(t.y-cam.y)-(py-H/2);
    const a=(i/P.trail.length)*0.3;
    ctx.globalAlpha=a;
    ctx.fillStyle= P.rageActive?'#ff2d55':'#ffcc00';
    ctx.beginPath();
    ctx.arc(rx,ry, P.size*0.55*(i/P.trail.length),0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  // Rage aura
  if(P.rageActive) {
    const ra=ctx.createRadialGradient(0,0,P.size,0,0,P.size*3.8);
    ra.addColorStop(0,'rgba(123,47,255,0.55)');
    ra.addColorStop(0.5,'rgba(255,45,85,0.2)');
    ra.addColorStop(1,'transparent');
    ctx.fillStyle=ra;
    ctx.beginPath();
    ctx.arc(0,0,P.size*3.8,0,Math.PI*2);
    ctx.fill();
  }

  // Body — Invincible blue suit
  ctx.fillStyle='#1155cc';
  ctx.beginPath();
  ctx.arc(0,0,P.size,0,Math.PI*2);
  ctx.fill();

  // Yellow chest I-mark
  ctx.fillStyle='#ffcc00';
  ctx.beginPath();
  ctx.roundRect(-7,-9,14,18,3);
  ctx.fill();

  // Head
  ctx.fillStyle='#f5c88a';
  ctx.beginPath();
  ctx.arc(0,-P.size*0.62,11,0,Math.PI*2);
  ctx.fill();

  // Mask (blue top half)
  ctx.fillStyle='#1155cc';
  ctx.beginPath();
  ctx.arc(0,-P.size*0.62,11,Math.PI,0);
  ctx.fill();
  // yellow mask stripe
  ctx.fillStyle='#ffcc00';
  ctx.fillRect(-11,-P.size*0.62-1,22,3);

  // Eyes
  const eyeC = P.laser?'#ffff00':'#ffffff';
  ctx.fillStyle=eyeC;
  if(P.laser) {
    ctx.shadowColor='#ffff00';
    ctx.shadowBlur=10;
  }
  ctx.beginPath();
  ctx.ellipse(-3.5,-P.size*0.62+2,3,2,0,0,Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(3.5,-P.size*0.62+2,3,2,0,0,Math.PI*2);
  ctx.fill();
  ctx.shadowBlur=0;

  // Punch effect
  if(P.punching) {
    const t=P.punchTimer/20;
    const fist_x=Math.cos(P.punchDir)*(P.size+20*(1-t));
    const fist_y=Math.sin(P.punchDir)*(P.size+20*(1-t));
    ctx.fillStyle='#f5c88a';
    ctx.strokeStyle='#ffcc00';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(fist_x,fist_y,9,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();
    // impact lines
    ctx.strokeStyle='rgba(255,255,200,0.6)';
    ctx.lineWidth=1.5;
    for(let k=0;k<5;k++) {
      const a=P.punchDir+(-0.6+k*0.3);
      ctx.beginPath();
      ctx.moveTo(fist_x+Math.cos(a)*9,fist_y+Math.sin(a)*9);
      ctx.lineTo(fist_x+Math.cos(a)*18,fist_y+Math.sin(a)*18);
      ctx.stroke();
    }
  }

  // Super punch glow
  if(P.superPunch) {
    ctx.strokeStyle='rgba(123,47,255,0.8)';
    ctx.lineWidth=4;
    ctx.shadowColor='#7b2fff';
    ctx.shadowBlur=20;
    ctx.beginPath();
    ctx.arc(0,0,P.size+6+Math.random()*4,0,Math.PI*2);
    ctx.stroke();
    ctx.shadowBlur=0;
  }

  // Invincibility blink
  if(P.invincTimer>0 && Math.floor(P.invincTimer/4)%2===0) {
    ctx.globalAlpha=0.4;
    ctx.fillStyle='#ffffff';
    ctx.beginPath();
    ctx.arc(0,0,P.size+2,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
  }

  ctx.restore();
}

// ════════════════════════════════
//  UTILS
// ════════════════════════════════
function hexA(hex,a) {
  const r=parseInt(hex.slice(1,3),16),
        g=parseInt(hex.slice(3,5),16),
        b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function lighten(hex,amt) {
  let r=parseInt(hex.slice(1,3),16)+amt,
      g=parseInt(hex.slice(3,5),16)+amt,
      b=parseInt(hex.slice(5,7),16)+amt;
  r=Math.min(255,r);g=Math.min(255,g);b=Math.min(255,b);
  return '#'+r.toString(16).padStart(2,'0')+g.toString(16).padStart(2,'0')+b.toString(16).padStart(2,'0');
}

// ════════════════════════════════
//  MAIN LOOP
// ════════════════════════════════
function loop() {
  if(!gameRunning) return;
  update();
  draw();
  raf=requestAnimationFrame(loop);
}
</script>
